name: Auto Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: auto-release-master
  cancel-in-progress: false

env:
  RELEASE_IGNORE_PATHS: |
    *.md
    bin/**
    docs/**
    build/**
    .github/**
    .claude/**
    .gitignore
    LICENSE

jobs:
  tag:
    name: Create version tag
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout validated commit and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check for release-worthy changes
        id: changes
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git tag --points-at HEAD --sort=-version:refname | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "A stable tag already points at this commit, so the release runs regardless of what changed"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --list --sort=-version:refname)

          if [ -z "$previous_tag" ]; then
            echo "No stable tag exists yet, so this is the first release"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed since $previous_tag:"
          git diff --name-only "$previous_tag" "$RELEASE_SHA"

          ignored_pathspecs=()
          while IFS= read -r mask; do
            if [ -n "$mask" ]; then
              ignored_pathspecs+=(":(exclude)$mask")
            fi
          done <<< "$RELEASE_IGNORE_PATHS"

          shipped_files="$(git diff --name-only "$previous_tag" "$RELEASE_SHA" -- . "${ignored_pathspecs[@]}")"
          if [ -z "$shipped_files" ]; then
            echo "Only documentation and tooling changed since $previous_tag, so no release is needed"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No release: nothing outside documentation and tooling changed since \`$previous_tag\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Changes that reach the binary:"
          printf '%s\n' "$shipped_files"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Calculate version
        id: version
        if: steps.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          existing_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              existing_tag="$candidate"
              break
            fi
          done < <(git tag --points-at HEAD --sort=-version:refname)

          if [ -n "$existing_tag" ]; then
            echo "Reusing existing tag $existing_tag"
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_message="$(git log -1 --pretty=%B)"
          source_branch="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" \
              --jq 'map(select(.base.ref == "master")) | .[0].head.ref // ""'
          )"
          echo "Source branch: ${source_branch:-direct push}"

          next_tag="$(./bin/next-version.sh "$commit_message" "" "$source_branch")"
          if git rev-parse --quiet --verify "refs/tags/$next_tag" >/dev/null; then
            echo "Version tag $next_tag already exists on another commit" >&2
            exit 1
          fi

          echo "Calculated tag $next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push version tag
        if: steps.version.outputs.created == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  release:
    name: Release
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
